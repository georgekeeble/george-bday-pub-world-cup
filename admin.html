  async function useVar(team) {

    const varRef = ref(
        db,
        "varRemaining/" + team

    const snapshot =
        await get(varRef);

    let current = 0;

    if (snapshot.exists()) {

    }

        await set(
            varRef,
            current - 1
        );

}

async function submitResult() {

    const homeTeam =
        document.getElementById("homeTeam").value;

    const awayTeam =
        document.getElementById("awayTeam").value;

    const homeGoals =
        parseInt(document.getElementById("homeGoals").value);

    const awayGoals =
        parseInt(document.getElementById("awayGoals").value);

    if(homeTeam === awayTeam) {
        alert("Choose different teams");
        return;
    }

    const homeRef =
        ref(db, "teams/" + homeTeam + "/matchPoints");

    const awayRef =
        ref(db, "teams/" + awayTeam + "/matchPoints");

    const homeSnap = await get(homeRef);
    const awaySnap = await get(awayRef);

    let homePoints =
        homeSnap.exists() ? homeSnap.val() : 0;

    let awayPoints =
        awaySnap.exists() ? awaySnap.val() : 0;

    if(homeGoals > awayGoals) {

        await set(
            homeRef,
            homePoints + 3
        );

    }
    else if(awayGoals > homeGoals) {

        await set(
            awayRef,
            awayPoints + 3
        );

    }
    else {

        await set(
            homeRef,
            homePoints + 1
        );

        await set(
            awayRef,
            awayPoints + 1
        );

    }

    await set(
        ref(db, "results/latest"),
        `${homeTeam} ${homeGoals}-${awayGoals} ${awayTeam}`
    );


  const historyRef = ref(
    db,
    "matchHistory/" + Date.now()
);

await set(historyRef, {
    homeTeam: homeTeam,
    awayTeam: awayTeam,
    homeGoals: homeGoals,
    awayGoals: awayGoals
});
  
    alert("Result submitted");

}
