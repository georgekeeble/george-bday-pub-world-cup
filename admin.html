<!DOCTYPE html>
<html>
<head>
    <title>World Cup Admin</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        input, select {
            padding: 8px;
            margin: 5px;
        }

    </style>

</head>
<body>

<h1>🏆 Tournament Director Dashboard</h1>

<div class="card">

<h2>⚽ Enter Match Result</h2>

<select>
    <option>Brazil</option>
    <option>England</option>
    <option>Germany</option>
    <option>Argentina</option>
</select>

<input type="number" placeholder="Goals">

v

<select>
    <option>Brazil</option>
    <option>England</option>
    <option>Germany</option>
    <option>Argentina</option>
</select>

<input type="number" placeholder="Goals">

<br><br>

<button>Submit Result</button>

</div>

<div class="card">

<h2>🍺 Beer Points</h2>

<p>Every full team round = +1 point</p>

<button>+1 Brazil</button>

<button>+1 England</button>

<button>+1 Germany</button>

<button>+1 Argentina</button>

</div>

<div class="card">

<h2>🎥 VAR Tracker</h2>

<button>-1 Brazil VAR</button>

<button>-1 England VAR</button>

<button>-1 Germany VAR</button>

<button>-1 Argentina VAR</button>

</div>

<div class="card">

<h2>⚡ Use Team Power</h2>

<button>Brazil Flair Used</button>

<button>England Bellingham Used</button>

<button>Germany Efficiency Used</button>

<button>Argentina Dark Arts Used</button>

</div>

<div class="card">

<h2>🚨 Transfer Announcement</h2>

<input
type="text"
placeholder="Enter transfer update"
style="width:100%;">

<br><br>

<button>Publish Transfer</button>

</div>

<div class="card">

<h2>🔗 Navigation</h2>

<p><a href="index.html">Home</a></p>

<p><a href="rules.html">Rules</a></p>

</div>

</body>
</html>
