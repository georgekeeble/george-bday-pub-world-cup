<!DOCTYPE html>
<html>
<head>
<title>Admin Test</title>
</head>
<body>

<h1>Admin Test</h1>

<button id="brazilBeerButton">
+1 Brazil Beer Point
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8WbNzfd32Iuk-MIL8A5kk4jTZ5xM4Ojs",
  authDomain: "george-bday-world-cup.firebaseapp.com",
  databaseURL: "https://george-bday-world-cup-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "george-bday-world-cup",
  storageBucket: "george-bday-world-cup.firebasestorage.app",
  messagingSenderId: "466193866055",
  appId: "1:466193866055:web:c66664b44dc90209230062"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document
.getElementById("brazilBeerButton")
.addEventListener("click", async () => {

    const beerRef = ref(
        db,
        "teams/brazil/beerPoints"
    );

    const snapshot = await get(beerRef);

    let current = 0;

    if(snapshot.exists()) {
        current = snapshot.val();
    }

    await set(
        beerRef,
        current + 1
    );

    alert("Brazil beer point added");

});

</script>

</body>
</html>
