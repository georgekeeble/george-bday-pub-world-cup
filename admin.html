<script type="module">

console.log("Firebase script loading...");

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8WbNzfd32Iuk-MIL8A5kk4jTZ5xM4Ojs",
  authDomain: "george-bday-world-cup.firebaseapp.com",
  databaseURL: "https://george-bday-world-cup-default-rtdb.europe-west1.firebasedatabase.app",

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
  async function useVar(team) {

    const varRef = ref(
        db,
        "varRemaining/" + team
    );

    const snapshot =
        await get(varRef);

    let current = 0;

    if (snapshot.exists()) {
        current = snapshot.val();
    }

    if (current > 0) {

        await set(
            varRef,
            current - 1
        );

        alert(
            team + " VAR used"
        );

    }

}

document.getElementById("brazilBeerButton")
.addEventListener("click", async () => {

    const beerRef = ref(db, "teams/brazil/beerPoints");

    const snapshot = await get(beerRef);

    let current = 0;

    if(snapshot.exists()) {
        current = snapshot.val();
    }

    await set(beerRef, current + 1);

    alert("Brazil beer point added");

});
  document
.getElementById("brazilVarButton")
.addEventListener("click", () =>
useVar("brazil"));
  document
