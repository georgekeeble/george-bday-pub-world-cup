<!DOCTYPE html>
<html>

<head>

<title>🟨🟥 So you've just been carded...</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin: auto;
    max-width: 600px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
}

#randomName {
    font-size: 30px;
    margin: 30px;
    color: #facc15;
}

a {
    color: #60a5fa;
}

</style>

</head>

<body>

<div class="card">

<h1>🟨🟥 So you've just been carded...</h1>

<div id="randomName">
Click Below.
<br>
Once for a 🟨, twice for a 🟥.
</div>

<button onclick="generateName()">
Good Luck
</button>

<br><br>

<a href="index.html">
⬅ Back to Tournament
</a>

</div>

<script>

const names = [

    "COVID hits! Any form of celebration in the next event voids your winning points only.",
    "Maradonna! Finish a beverage during your next event, no finish = no points.",
    "Chelsea/Strasbourg! Buy your opponent a beverage.",
    "Hydration Break! Finish your drink.",
    "Luke Shaw! Buy your team a round of crisps",
    "Greenwood! Removes one of your team's VAR uses",
    "Adverse Weather! Finish your drink or take cover under the table (5 mins)",
    "Maitland Niles! Choose a team mate to press the button and take your punishment",
    "Bruno kicks Foden! Choose an opposition to press the button and take your punishment",
    "If you like ladies football...! Any member of your team of the opposite gender joins you in the next punishment (press again)",
    "Spurs sympathy! Buy the current bottom place team something from the bar",
    "115 charges?! Play on."

];

function generateName() {

    const randomIndex =
        Math.floor(
            Math.random() * names.length
        );

    document.getElementById(
        "randomName"
    ).innerText =
        names[randomIndex];

}

</script>

</body>

</html>
