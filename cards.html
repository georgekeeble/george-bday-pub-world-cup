<!DOCTYPE html>
<html>

<head>

<title>🟨🟥 So you've just been carded...</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin: auto;
    max-width: 600px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
}

#randomName {
    font-size: 30px;
    margin: 30px;
    color: #facc15;
}

a {
    color: #60a5fa;
}

</style>

</head>

<body>

<div class="card">

<h1>🟨🟥 So you've just been carded...</h1>

<div id="randomName">
Click Below
</div>

<button onclick="generateName()">
Good Luck
</button>

<br><br>

<a href="index.html">
⬅ Back to Tournament
</a>

</div>

<script>

const names = [

    "Beer Messi",
    "Pub Guardiola",
    "VARnold Schwarzenegger",
    "Pintlo Ancelotti",
    "Sir Drinks-A-Lot",
    "Alejandro Garnacho",
    "Jurgen Klopint",
    "Wayne Rooneypint",
    "Cristiano Ronaldrink",
    "The Beerminator"

];

function generateName() {

    const randomIndex =
        Math.floor(
            Math.random() * names.length
        );

    document.getElementById(
        "randomName"
    ).innerText =
        names[randomIndex];

}

</script>

</body>

</html>
