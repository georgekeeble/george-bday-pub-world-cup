<!DOCTYPE html>
<html>

<head>

    <title>🟨🟥 Card Generator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            margin: auto;
            max-width: 600px;
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            color: #facc15;
            margin: 30px 0;
            min-height: 70px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #60a5fa;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🟨🟥 So you've just been carded...</h1>

    <p>
        Press the button to receive a random outcome.
    </p>

    <div id="result">
        Good luck...
    </div>

    <button id="generateButton">
        🎲 Generate Outcome
    </button>

    <br>

    <a href="index.html" class="back">
        ⬅ Back to Tournament
    </a>

</div>
<script>
    
const outcomes = [

    "COVID hits! Any form of celebration in the next event voids your winning points only.",
    "Maradonna! Finish a beverage during your next event, no finish = no points.",
    "Chelsea/Strasbourg! Buy your opponent a beverage.",
    "Hydration Break! Finish your drink.",
    "Luke Shaw! Buy your team a round of crisps",
    "Greenwood! Removes one of your team's VAR uses",
    "Adverse Weather! Finish your drink or take cover under the table (5 mins)",
    "Maitland Niles! Choose a team mate to press the button and take your punishment",
    "Bruno kicks Foden! Choose an opposition to press the button and take your punishment",
    "If you like ladies football...! Any member of your team of the opposite gender joins you in the next punishment (press again)",
    "Spurs sympathy! Buy the current bottom place team something from the bar",
    "David Coote is a nonce! Referee must do the next punishment (press again)",
    "Aluko does the math! Either buy a round for the whole group or finish your current drink and apologise to the room",
    "Sterlings at the wheel, ole ole!! Blow up a balloon during your next activity, fail, and if its popped, finish your drink",
    "Man City spend £300m in January! Reset your team's special ability",
    "115 charges?! Odds on 115, get it right, give out 3 pint chops, get it wrong, no sanction, play on"

];

const button =
    document.getElementById("generateButton");

const result =
    document.getElementById("result");

button.addEventListener("click", function () {

    const randomNumber =
        Math.floor(
            Math.random() * outcomes.length
        );

    result.textContent =
        outcomes[randomNumber];

});

</script>

</body>

</html>
